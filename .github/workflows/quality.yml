name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          npm ci

      - name: Run Biome (format + lint)
        run: |
          npm run lint

      - name: Check architecture boundaries
        run: |
          npm run arch

      - name: Check for dead code and unused dependencies
        run: |
          npm run knip

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Run unit tests with coverage
        run: |
          npm run test:coverage

      - name: Build the package that will be published
        run: |
          npm run build

      - name: Test coverage
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .github/octocov.yml

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          npm ci

      - name: Lint commit messages (Conventional Commits drive releases)
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose
