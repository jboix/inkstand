name: 🐛 Bug Report
description: Report a possible bug or regression
title: "🐛 <TITLE>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide a clear and concise
        description of what the bug is; reports that cannot be reproduced
        take much longer to fix.
  - type: textarea
    id: environment
    attributes:
      label: Environment information
      description: >
        Paste the output of `npm ls inkstand ink react`, `node --version`, and
        your operating system and terminal emulator. Terminal behavior varies
        between emulators, so the emulator matters for rendering and key
        handling reports.
      value: |
        <details>

        ```
        Paste output here
        ```

        </details>
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: Which part
      description: The machine, view, hook, or function involved.
      placeholder: LineEditor, <Select>, useScreenSlot, diffLines
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: What happened?
      description: >
        Provide the steps that reproduce the issue. The parts are controlled
        and hold no durable state, so a minimal component that passes the
        props and the keystrokes is usually enough.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: Describe what you expected to happen.
      placeholder: The caret should stay at the end of the line.
    validations:
      required: true
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/jboix/inkstand/blob/main/docs/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow inkstand's Code of Conduct
          required: true
